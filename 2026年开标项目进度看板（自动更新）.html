<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年开标项目进度看板</title>
<style>
  /* ===== 密码验证遮罩 ===== */
  .pw-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #e2e8f0 0%, #edf0f5 50%, #e8ecf2 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 99999;
  }
  .pw-overlay.hidden { display: none; }
  .pw-box {
    background: #fff; border-radius: 16px; padding: 36px 40px;
    box-shadow: 0 8px 40px rgba(30,58,95,0.15); text-align: center;
    max-width: 380px; width: 90%;
  }
  .pw-box h2 { font-size: 18px; color: #1a2a3a; margin-bottom: 6px; }
  .pw-box p { font-size: 13px; color: #5a6a7a; margin-bottom: 20px; }
  .pw-input {
    width: 100%; padding: 12px 16px; border: 2px solid #d5dce6;
    border-radius: 10px; font-size: 16px; text-align: center;
    outline: none; transition: border-color .2s;
    font-family: 'Microsoft YaHei', sans-serif;
  }
  .pw-input:focus { border-color: #1e3a5f; }
  .pw-btn {
    margin-top: 16px; padding: 10px 32px; background: #1e3a5f; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  .pw-btn:hover { background: #16324f; }
  .pw-error { color: #c0392b; font-size: 12px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<!-- 密码验证遮罩 -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-box">
    <h2>🔒 访问验证</h2>
    <p>请输入访问密码以查看看板数据</p>
    <input type="password" class="pw-input" id="pwInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')checkPw()">
    <br>
    <button class="pw-btn" onclick="checkPw()">验 证</button>
    <div class="pw-error" id="pwError"></div>
  </div>
</div>
<!-- PW_START 密码验证区域，auto_import.py 和分享版会启用 -->
<div class="pw-overlay hidden" id="pwOverlay">
  <div class="pw-box">
    <h2>🔒 访问验证</h2>
    <p>请输入访问密码以查看看板数据</p>
    <input type="password" class="pw-input" id="pwInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')checkPw()">
    <br>
    <button class="pw-btn" onclick="checkPw()">验 证</button>
    <div class="pw-error" id="pwError"></div>
  </div>
</div>
<script>
(function(){
  var _ACCESS_PASSWORD = '';
  function checkPw(){
    var input = document.getElementById('pwInput').value;
    var errEl = document.getElementById('pwError');
    if(input === _ACCESS_PASSWORD){
      document.getElementById('pwOverlay').classList.add('hidden');
      sessionStorage.setItem('_bid_auth','1');
    } else {
      errEl.textContent = '密码错误，请重试';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }
  window.checkPw = checkPw;
  window._enablePw = function(pwd){
    _ACCESS_PASSWORD = pwd;
    if(pwd && sessionStorage.getItem('_bid_auth') !== '1'){
      document.getElementById('pwOverlay').classList.remove('hidden');
      document.getElementById('pwInput').focus();
    }
  };
})();
</script>
<style>
  :root {
    --primary: #1e3a5f;
    --primary-light: #e8edf5;
    --success: #2d7d46;
    --success-light: #edf5ee;
    --warning: #d4920a;
    --warning-light: #faf3e0;
    --danger: #c0392b;
    --card: #ffffff;
    --border: #d5dce6;
    --text: #1a2a3a;
    --text-muted: #5a6a7a;
    --shadow: 0 2px 8px rgba(30,58,95,0.06), 0 6px 20px rgba(0,0,0,0.05);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, #e2e8f0 0%, #edf0f5 50%, #e8ecf2 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  /* ===== 顶部 ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-title h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: .5px;
  }
  .header-title .icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #1e3a5f, #2c5282);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(30,58,95,0.3);
  }
  .header-title .icon svg { color: #fff; }

  /* ===== 按钮 ===== */
  .btn-import {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  .btn-import:hover { background: #16324f; }
  .btn-import:active { transform: scale(.97); }
  .btn-clear {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; color: var(--text-muted);
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .2s;
  }
  .btn-clear:hover { border-color: var(--danger); color: var(--danger); }
  .btn-share {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, #1e3a5f, #2c5282);
    color: #fff; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .2s;
    white-space: nowrap;
    box-shadow: 0 3px 12px rgba(30,58,95,0.25);
  }
  .btn-share:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(30,58,95,0.35); }
  .btn-share:active { transform: scale(.97); }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ===== 统计卡片 ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform .2s, box-shadow .2s;
    border-left: 4px solid transparent;
  }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 4px 16px rgba(30,58,95,0.1); }
  .stat-card.blue-card { border-left-color: #1e3a5f; background: linear-gradient(135deg, #fff 60%, #eef2f8); }
  .stat-card.green-card { border-left-color: #2d7d46; background: linear-gradient(135deg, #fff 60%, #edf5ee); }
  .stat-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .stat-icon.blue { background: linear-gradient(135deg, #eef2f8, #dbeafe); border: 1.5px solid #b4c6e0; }
  .stat-icon.green { background: linear-gradient(135deg, #edf5ee, #d1e8d4); border: 1.5px solid #a3c9a8; }
  .stat-content .label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-content .value { font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; }
  .stat-content .value.green { color: #2d7d46; }
  .stat-content .value.blue { color: #1e3a5f; }
  .stat-content .sub { font-size: 12px; color: #c0392b; margin-top: 3px; }

  /* 新拓/存量统计 - 显示在总数右边 */
  .stat-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat-detail {
    display: flex;
    gap: 6px;
  }
  .stat-detail-item {
    font-size: 14px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .stat-detail-xintuo {
    background: #d1e8d4;
    color: #1a5632;
  }
  .stat-detail-cunliang {
    background: #d0e4f5;
    color: #1a4060;
  }
  .stat-detail-other {
    background: #f1f5f9;
    color: #94a3b8;
  }

  /* ===== 区块 ===== */
  .section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
    border-top: 3px solid transparent;
  }
  .section.week-section { border-top-color: #2d7d46; }
  .section.pending-section { border-top-color: var(--primary); }
  .section-head {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section.week-section .section-head { background: linear-gradient(90deg, #edf5ee 0%, #fff 100%); }
  .section.pending-section .section-head { background: linear-gradient(90deg, #eef2f8 0%, #fff 100%); }
  .section-head-left { display: flex; align-items: center; gap: 10px; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .imp-hint {
    font-size: 11px;
    color: #c0392b;
    white-space: nowrap;
  }
  .week-badge {
    background: linear-gradient(135deg, #1e3a5f, #2c5282);
    color: #fff; font-size: 12px; font-weight: 600;
    padding: 4px 12px; border-radius: 20px; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(30,58,95,0.2);
  }
  .count-badge { font-size: 13px; color: var(--text-muted); font-weight: 500; }

  /* ===== 表格 ===== */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { background: linear-gradient(90deg, #f0f3f7, #e8edf5); }
  .section.pending-section thead tr { background: linear-gradient(90deg, #e8edf5, #eef2f8); }
  thead th {
    padding: 12px 14px; text-align: left;
    font-size: 12px; font-weight: 700; color: #3a4a5a;
    letter-spacing: .4px; white-space: nowrap;
    border-bottom: 2px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid #f1f5f9;
    transition: background .15s;
  }
  tbody tr:nth-child(even) { background: #f7f9fb; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #e8edf5; }
  .section.pending-section tbody tr:nth-child(even) { background: #f5f8fb; }
  .section.pending-section tbody tr:hover { background: #e8edf5; }
  tbody td {
    padding: 11px 14px;
    color: var(--text);
    vertical-align: middle;
  }
  .td-time { white-space: nowrap; color: var(--text-muted); }
  .td-amount {
    font-weight: 400; color: var(--text);
    text-align: right;
  }
  .td-name { font-weight: 500; }
  .td-org { color: var(--text-muted); }

  /* ===== 标签 ===== */
  .tag-today {
    display: inline-block; background: #f5d5d5; color: #a03030;
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 10px;
    margin-left: 6px; vertical-align: middle;
  }
  .tag-week {
    display: inline-block; background: #d0e4f5; color: #1a4060;
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 10px;
    margin-left: 6px; vertical-align: middle;
  }
  .tag-xintuo {
    display: inline-block; background: #d1e8d4; color: #1a5632;
    font-size: 11px; font-weight: 700;
    padding: 2px 9px; border-radius: 10px;
    margin-right: 6px; vertical-align: middle;
  }
  .tag-cunliang {
    display: inline-block; background: #d0e4f5; color: #1a4060;
    font-size: 11px; font-weight: 700;
    padding: 2px 9px; border-radius: 10px;
    margin-right: 6px; vertical-align: middle;
  }
  .tag-important {
    display: inline-block; background: #f5d5d5; color: #a03030;
    font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: 10px;
    margin-left: 6px; vertical-align: middle;
  }
  .tag-opened {
    display: inline-block; background: #dfe4ea; color: #5a6a7a;
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 10px;
    margin-left: 6px; vertical-align: middle;
  }

  /* ===== 分页 ===== */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .pagination .page-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 36px; height: 36px;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--text);
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .2s;
    padding: 0 10px;
  }
  .pagination .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: #e8edf5; }
  .pagination .page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .pagination .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pagination .page-info { font-size: 13px; color: var(--text-muted); padding: 0 6px; white-space: nowrap; }

  /* ===== 空状态 ===== */
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
  .empty-state p { font-size: 14px; line-height: 1.7; }

  /* ===== 导入区域 ===== */
  .drop-zone {
    border: 2.5px dashed #b4bed0; border-radius: var(--radius);
    text-align: center; padding: 48px 24px;
    cursor: pointer; transition: all .2s; margin-bottom: 24px;
    background: linear-gradient(135deg, #fff, #f8faff);
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: #1e3a5f;
    background: linear-gradient(135deg, #e8edf5, #edf0f5);
    box-shadow: 0 4px 20px rgba(30,58,95,0.12);
  }
  .drop-zone .dz-icon { font-size: 36px; margin-bottom: 10px; }
  .drop-zone .dz-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .drop-zone .dz-sub { font-size: 13px; color: var(--text-muted); }
  .drop-zone .dz-hint {
    margin-top: 10px; font-size: 12px; color: #94a3b8;
    background: #f1f5f9; border-radius: 6px; padding: 6px 12px; display: inline-block;
  }
  #fileInput { display: none; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: linear-gradient(135deg, #1e3a5f, #2c5282);
    color: #fff; padding: 12px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    z-index: 9999;
    transform: translateY(80px); opacity: 0;
    transition: all .3s cubic-bezier(.4,0,.2,1);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: linear-gradient(135deg, #1a5632, #2d7d46); }
  .toast.error { background: linear-gradient(135deg, #922020, #c0392b); }

  .data-meta { font-size: 12px; color: var(--text-muted); text-align: right; margin-bottom: 6px; padding: 0 4px; }

  /* 手机端金额标签（桌面端隐藏） */
  .mob-amount { display: none; }

  /* ===== 搜索栏 ===== */
  .search-bar {
    display: flex;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: #f8f9fc;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-bar .search-item {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 180px;
  }
  .search-bar label {
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    white-space: nowrap;
    min-width: 48px;
    flex-shrink: 0;
  }
  .search-bar input, .search-bar select {
    flex: 1;
    min-width: 0;
    height: 32px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 0 10px;
    font-size: 13px;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
  }
  .search-bar select {
    padding: 0 8px;
    cursor: pointer;
    -webkit-appearance: menulist;
  }
  .search-bar input:focus, .search-bar select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,58,95,0.08); }
  .search-bar input::placeholder { color: #b0b8c9; }
  .search-bar .btn-search {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 7px;
    padding: 7px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .2s;
    white-space: nowrap;
  }
  .search-bar .btn-search:hover { background: #16324f; }
  .search-bar .btn-reset {
    display: inline-flex; align-items: center; gap: 5px;
    background: #fff; color: var(--text-muted);
    border: 1.5px solid var(--border); border-radius: 7px;
    padding: 7px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .2s;
    white-space: nowrap;
  }
  .search-bar .btn-reset:hover { border-color: var(--danger); color: var(--danger); }
  .search-result-info {
    font-size: 12px; color: var(--text-muted); padding: 8px 22px 0;
    font-style: italic;
  }

  /* ===== 合计 ===== */
  .sum-row {
    text-align: right;
    padding: 10px 22px;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    border-top: 1.5px solid var(--border);
  }

  /* ===== 机构维度分析 ===== */
  .org-chart-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
    border-top: 3px solid #e67e22;
  }
  .org-chart-section .section-head {
    background: linear-gradient(90deg, #fef5ec 0%, #fff 100%);
  }
  .org-chart-wrap {
    padding: 20px 22px;
  }
  .org-chart-wrap canvas {
    width: 100% !important;
    max-height: 360px;
  }
  .org-chart-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ===== 快捷筛选按钮组 ===== */
  .quick-filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--border);
    background: #f8f9fc;
  }
  .qf-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    color: var(--text-muted);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .qf-btn:hover { border-color: var(--primary); color: var(--primary); }
  .qf-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(30,58,95,0.2);
  }
  .qf-info {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
  }

  /* ===== 响应式（手机端缩小字体，保持完整表格布局） ===== */
  @media (max-width: 768px) {
    body { padding: 8px; }
    .stats-grid { grid-template-columns: 1fr; gap: 8px; }
    .stat-card { padding: 12px 14px; gap: 12px; }
    .stat-icon { width: 40px; height: 40px; }
    .stat-icon svg { width: 20px; height: 20px; }
    .stat-content .value { font-size: 18px; }
    .stat-content .label { font-size: 11px; }
    .stat-content .sub { font-size: 11px; }
    .stat-row { gap: 6px; }
    .stat-detail { gap: 4px; }
    .stat-detail-item { font-size: 12px; padding: 1px 6px; }
    .header-title h1 { font-size: 17px; }
    .header-title .icon { width: 30px; height: 30px; border-radius: 8px; }
    .header-title .icon svg { width: 16px; height: 16px; }
    .header-actions { gap: 6px; }
    .btn-import, .btn-share { padding: 7px 12px; font-size: 12px; }
    .btn-clear { padding: 7px 10px; font-size: 12px; }

    .section-head { padding: 10px 12px; }
    .section-head-left { flex-direction: column; align-items: flex-start; gap: 4px; }
    .section-title { font-size: 13px; }
    .week-badge { font-size: 10px; padding: 3px 8px; }

    .search-bar { padding: 8px 12px; gap: 6px; }
    .search-bar .search-item { min-width: 100%; }
    .search-bar label { font-size: 11px; min-width: 42px; flex-shrink: 0; }
    .search-bar input, .search-bar select { height: 28px; font-size: 12px; min-width: 0; }
    .search-bar .btn-search, .search-bar .btn-reset { padding: 5px 10px; font-size: 12px; }

    /* 保持表格布局，缩小字体 */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { font-size: 11px; }
    thead th { padding: 8px 8px; font-size: 11px; }
    tbody td { padding: 7px 8px; }
    .td-time { font-size: 11px; }
    .td-name { font-size: 11px; }
    .td-org { font-size: 11px; }
    .td-amount { font-size: 11px; }

    .tag-xintuo, .tag-cunliang, .tag-important, .tag-today, .tag-week, .tag-opened {
      font-size: 9px;
      padding: 1px 5px;
      margin-left: 3px;
    }

    .pagination { padding: 10px 12px; }
    .pagination .page-btn { min-width: 30px; height: 30px; font-size: 12px; padding: 0 6px; }
    .pagination .page-info { font-size: 11px; }

    .sum-row { padding: 8px 12px; font-size: 12px; }
    .org-chart-wrap { padding: 12px; }
    .org-chart-wrap canvas { max-height: 280px; }
    .search-result-info { font-size: 11px; padding: 6px 12px 0; }
    .data-meta { font-size: 11px; }
    .empty-state { padding: 30px 16px; }
    .empty-state .empty-icon { font-size: 28px; }
    .empty-state p { font-size: 12px; }

    .toast {
      bottom: 10px; right: 10px; left: 10px;
      font-size: 12px; text-align: center;
    }

    .mob-amount { display: none !important; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <div class="icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <h1>2026年开标项目进度看板</h1>
  </div>
  <div class="header-actions">
    <button class="btn-clear" id="btnClear" style="display:none" onclick="clearData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      清除数据
    </button>
    <button class="btn-share" id="btnShare" style="display:none" onclick="shareDashboard()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      分享看板
    </button>
    <button class="btn-import" onclick="document.getElementById('fileInput').click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      导入数据
    </button>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" onchange="handleFile(this.files[0])">
  </div>
</div>

<div id="dropZone" style="display:none"></div>

<div id="dashboard" style="display:none">
  <div class="data-meta" id="dataMeta"></div>

  <div class="stats-grid">
    <div class="stat-card green-card">
      <div class="stat-icon green">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2d7d46" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="stat-content">
        <div class="label">本周开标项目</div>
        <div class="stat-row">
          <div class="value green" id="statWeek">0</div>
          <div class="stat-detail" id="statWeekDetail"></div>
        </div>
        <div class="sub" id="statWeekSub"></div>
      </div>
    </div>
    <div class="stat-card blue-card">
      <div class="stat-icon blue">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-content">
        <div class="label">待开标项目</div>
        <div class="stat-row">
          <div class="value blue" id="statPending">0</div>
          <div class="stat-detail" id="statPendingDetail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 机构维度分析（紧随汇总卡片） -->
  <div class="section org-chart-section">
    <div class="section-head">
      <div class="section-head-left">
        <span class="section-title">📊 待开标项目机构分布图</span>
      </div>
      <span class="count-badge" id="orgChartCount"></span>
    </div>
    <div class="org-chart-wrap">
      <canvas id="orgChartCanvas"></canvas>
    </div>
  </div>

  <!-- 统一明细表 -->
  <div class="section pending-section">
    <div class="section-head">
      <div class="section-head-left">
        <span class="section-title">📋 项目明细</span>
        <span class="imp-hint">招标金额单位：万元 | 重要：≥1000万元</span>
      </div>
      <span class="count-badge" id="pendingCount"></span>
    </div>
    <!-- 快捷筛选按钮组 -->
    <div class="quick-filter-bar">
      <button class="qf-btn active" id="qfAll" onclick="switchQuickFilter('all')">全部</button>
      <button class="qf-btn" id="qfMonth" onclick="switchQuickFilter('month')">本月</button>
      <button class="qf-btn" id="qfWeek" onclick="switchQuickFilter('week')">本周</button>
      <span class="qf-info" id="qfInfo"></span>
    </div>
    <div class="search-bar" id="searchBar">
      <div class="search-item">
        <label>机构名称</label>
        <input type="text" id="searchOrg" placeholder="输入机构名称" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="search-item">
        <label>项目名称</label>
        <input type="text" id="searchProj" placeholder="输入项目名称" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="search-item">
        <label>客户名称</label>
        <input type="text" id="searchClient" placeholder="输入客户名称" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="search-item">
        <label>开标时间</label>
        <input type="text" id="searchTime" placeholder="如：04（按月）或 04-20（按日）" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="search-item">
        <label>投标性质</label>
        <select id="searchNature" onchange="doSearch()">
          <option value="">全部</option>
          <option value="新拓">新拓</option>
          <option value="存量">存量</option>
        </select>
      </div>
      <button class="btn-search" onclick="doSearch()">🔍 搜索</button>
      <button class="btn-reset" onclick="resetSearch()">重置</button>
    </div>
    <div id="searchResultInfo" class="search-result-info" style="display:none"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>开标时间</th>
            <th>机构名称</th>
            <th>项目名称</th>
            <th>客户名称</th>
            <th style="text-align:right">招标金额</th>
          </tr>
        </thead>
        <tbody id="pendingBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pendingPagination"></div>
    <div class="sum-row" id="pendingSum" style="display:none"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" onerror="sheetJsLoadError()"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" onerror="chartJsLoadError()"></script>
<script>
var XLSX_AVAILABLE = (typeof XLSX !== 'undefined');
var CHART_AVAILABLE = (typeof Chart !== 'undefined');
function sheetJsLoadError() {
  XLSX_AVAILABLE = false;
  console.warn('SheetJS未加载，仅支持CSV格式');
}
function chartJsLoadError() {
  CHART_AVAILABLE = false;
  console.warn('Chart.js未加载，机构分析图表无法显示');
}

var PAGE_SIZE = 20;
var allRows = [];           // 所有有效数据
var pendingAllRows = [];    // 待开标（今日起）
var pendingFilteredRows = [];// 搜索过滤后的
var quickFilterRows = [];   // 快捷筛选后的基础数据
var currentQuickFilter = 'all'; // all | week | month
var pendingCurrentPage = 1;
var isSearchActive = false;

// =========================================
// 工具函数
// =========================================
function getWeekRange(date) {
  var d = new Date(date);
  var day = d.getDay();
  var diffToMon = (day === 0) ? -6 : 1 - day;
  var mon = new Date(d);
  mon.setDate(d.getDate() + diffToMon);
  mon.setHours(0, 0, 0, 0);
  var sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  sun.setHours(23, 59, 59, 999);
  return { mon: mon, sun: sun };
}

function getWeekNumber(date) {
  var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  var dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function fmtDate(date) {
  if (!date) return '';
  var d = new Date(date);
  if (isNaN(d)) return String(date);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function fmtMD(date) { return (date.getMonth()+1) + '月' + date.getDate() + '日'; }
function pad(n) { return n < 10 ? '0' + n : n; }

function parseAmount(val) {
  if (val === null || val === undefined || val === '') return null;
  var n = parseFloat(String(val).replace(/[,，\s]/g, ''));
  return isNaN(n) ? null : n;
}

function fmtAmount(val) {
  if (val === null || val === undefined) return '-';
  return val.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 统计新拓/存量数量
function countNature(rows) {
  var xt = 0, cl = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i]._nature === '新拓') xt++;
    else if (rows[i]._nature === '存量') cl++;
  }
  return { xt: xt, cl: cl, other: rows.length - xt - cl };
}

function renderNatureDetail(counts) {
  var html = '';
  if (counts.xt > 0) html += '<span class="stat-detail-item stat-detail-xintuo">新拓 ' + counts.xt + '</span>';
  if (counts.cl > 0) html += '<span class="stat-detail-item stat-detail-cunliang">存量 ' + counts.cl + '</span>';
  if (counts.other > 0) html += '<span class="stat-detail-item stat-detail-other">其他 ' + counts.other + '</span>';
  return html;
}

// =========================================
// 列名映射
// =========================================
var COL_PATTERNS = {
  time:   ['开标时间','开标日期','开标','时间','日期','date','time'],
  org:    ['机构名称','机构','代理机构','采购机构','招标机构','org','agency'],
  proj:   ['项目名称','项目','工程名称','标段名称','名称','project','title'],
  client: ['客户名称','客户','建设单位','采购人','业主','招标人','client','owner'],
  amount: ['招标金额','金额','控制价','预算金额','预算','标的金额','amount','price','万元'],
  nature: ['投标性质','性质','项目性质','类型','type','category','投标类型']
};

function detectColumns(headers) {
  var map = {};
  var used = {};
  for (var key in COL_PATTERNS) {
    var patterns = COL_PATTERNS[key];
    for (var i = 0; i < patterns.length; i++) {
      for (var j = 0; j < headers.length; j++) {
        if (headers[j] && headers[j].indexOf(patterns[i]) >= 0 && !used[j]) {
          map[key] = j;
          used[j] = true;
          break;
        }
      }
      if (map[key] !== undefined) break;
    }
  }
  return map;
}

// =========================================
// 解析日期
// =========================================
function parseDate(val) {
  if (!val && val !== 0) return null;
  if (typeof val === 'number') {
    var d = new Date((val - 25569) * 86400 * 1000);
    if (!isNaN(d) && d.getFullYear() > 1990 && d.getFullYear() < 2100) return d;
  }
  var s = String(val).trim();
  if (!s) return null;
  var cleaned = s.replace(/[年月]/g, '-').replace(/[日号]/g, '').replace(/\//g, '-');
  var d = new Date(cleaned);
  if (!isNaN(d)) return d;
  return null;
}

// =========================================
// 分页渲染
// =========================================
function renderTableWithPagination(rows, tbodyId, pagId, currentPage) {
  var tbody = document.getElementById(tbodyId);
  var pagDiv = document.getElementById(pagId);
  var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  var start = (currentPage - 1) * PAGE_SIZE;
  var pageRows = rows.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = '';

  if (pageRows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📭</div><p>暂无数据</p></div></td></tr>';
    pagDiv.innerHTML = '';
    return currentPage;
  }

  var now = new Date();
  var todayStart = new Date(now); todayStart.setHours(0,0,0,0);
  var todayEnd = new Date(now); todayEnd.setHours(23,59,59,999);
  var weekRange = getWeekRange(now);

  for (var i = 0; i < pageRows.length; i++) {
    var r = pageRows[i];
    var tr = document.createElement('tr');
    var amt = r._amount;

    // 时间标签（统一逻辑）
    var timeLabel = '';
    var openDateEnd = new Date(r._time); openDateEnd.setHours(23,59,59,999);
    if (openDateEnd < now) {
      timeLabel = '<span class="tag-opened">已开标</span>';
    } else if (r._time >= todayStart && r._time <= todayEnd) {
      timeLabel = '<span class="tag-today">今日</span>';
    } else if (r._time >= weekRange.mon && r._time <= weekRange.sun) {
      timeLabel = '<span class="tag-week">本周</span>';
    }

    // 投标性质标签
    var natureTag = '';
    if (r._nature === '新拓') natureTag = '<span class="tag-xintuo">新拓</span>';
    else if (r._nature === '存量') natureTag = '<span class="tag-cunliang">存量</span>';

    // 重要标签（>=1000万）
    var importantTag = '';
    if (amt !== null && amt >= 1000) importantTag = '<span class="tag-important">重要</span>';

    var projHtml = natureTag + esc(r.proj || '-') + importantTag;
    var amtStr = (amt !== null ? fmtAmount(amt) : '-');

    tr.innerHTML =
      '<td class="td-time" data-label="开标时间">' + fmtDate(r._time) + timeLabel +
        '<span class="mob-amount">' + amtStr + '</span></td>' +
      '<td class="td-org" data-label="机构名称">' + esc(r.org || '-') + '</td>' +
      '<td class="td-name" data-label="项目名称">' + projHtml + '</td>' +
      '<td data-label="客户名称">' + esc(r.client || '-') + '</td>' +
      '<td class="td-amount" data-label="招标金额">' + amtStr + '</td>';
    tbody.appendChild(tr);
  }

  // 分页控件
  if (rows.length > PAGE_SIZE) {
    var html = '';
    html += '<button class="page-btn" onclick="goPage(\'' + pagId + '\', 1)"' + (currentPage <= 1 ? ' disabled' : '') + '>&laquo;</button>';
    html += '<button class="page-btn" onclick="goPage(\'' + pagId + '\', ' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>&lsaquo; 上一页</button>';
    var startP = Math.max(1, currentPage - 2);
    var endP = Math.min(totalPages, currentPage + 2);
    if (startP > 1) html += '<span class="page-info">...</span>';
    for (var p = startP; p <= endP; p++) {
      html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" onclick="goPage(\'' + pagId + '\', ' + p + ')">' + p + '</button>';
    }
    if (endP < totalPages) html += '<span class="page-info">...</span>';
    html += '<button class="page-btn" onclick="goPage(\'' + pagId + '\', ' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>下一页 &rsaquo;</button>';
    html += '<button class="page-btn" onclick="goPage(\'' + pagId + '\', ' + totalPages + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>&raquo;</button>';
    html += '<span class="page-info">' + currentPage + ' / ' + totalPages + ' 页，共 ' + rows.length + ' 条</span>';
    pagDiv.innerHTML = html;
  } else {
    pagDiv.innerHTML = rows.length > 0 ? '<span class="page-info">共 ' + rows.length + ' 条记录</span>' : '';
  }

  return currentPage;
}

function goPage(pagId, page) {
  var data = isSearchActive ? pendingFilteredRows : quickFilterRows;
  pendingCurrentPage = renderTableWithPagination(data, 'pendingBody', 'pendingPagination', page);
}

// =========================================
// 主渲染
// =========================================
function renderDashboard(rows) {
  if (!rows || rows.length === 0) {
    showToast('文件内没有有效数据，请检查格式', 'error'); return;
  }

  var now = new Date();
  var weekRange = getWeekRange(now);
  var weekNum = getWeekNumber(now);
  var todayStart = new Date(now); todayStart.setHours(0,0,0,0);
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  var monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);

  allRows = rows;
  pendingAllRows = [];

  for (var i = 0; i < rows.length; i++) {
    var t = rows[i]._time;
    if (!t) continue;
    if (t >= todayStart) pendingAllRows.push(rows[i]);
  }

  pendingAllRows.sort(function(a, b) { return a._time - b._time; });

  // 本周和本月统计（用于汇总卡片）
  var weekRows = [];
  var monthRows = [];
  for (var i = 0; i < rows.length; i++) {
    var t = rows[i]._time;
    if (!t) continue;
    if (t >= weekRange.mon && t <= weekRange.sun) weekRows.push(rows[i]);
    if (t >= monthStart && t <= monthEnd) monthRows.push(rows[i]);
  }

  // 统计卡 - 本周开标项目
  var weekAmount = weekRows.reduce(function(s, r) { return s + (r._amount || 0); }, 0);
  document.getElementById('statWeek').textContent = weekRows.length + ' 个 / ' + fmtAmount(weekAmount) + ' 万元';
  document.getElementById('statWeekDetail').innerHTML = renderNatureDetail(countNature(weekRows));
  // 本周信息：第X周 X月X日 - X月X日
  var weekSub = document.getElementById('statWeekSub');
  if (weekSub) {
    var monStr = (weekRange.mon.getMonth()+1) + '/' + weekRange.mon.getDate();
    var sunStr = (weekRange.sun.getMonth()+1) + '/' + weekRange.sun.getDate();
    weekSub.textContent = '第 ' + weekNum + ' 周  ' + monStr + ' - ' + sunStr;
  }

  // 统计卡 - 待开标项目
  var pendingAmount = pendingAllRows.reduce(function(s, r) { return s + (r._amount || 0); }, 0);
  document.getElementById('statPending').textContent = pendingAllRows.length + ' 个 / ' + fmtAmount(pendingAmount) + ' 万元';
  document.getElementById('statPendingDetail').innerHTML = renderNatureDetail(countNature(pendingAllRows));

  // 设置快捷筛选按钮的信息提示
  var qfInfo = document.getElementById('qfInfo');
  qfInfo.textContent = '本月共 ' + monthRows.length + ' 个 ｜ 本周共 ' + weekRows.length + ' 个';

  // 默认显示全部（待开标）
  switchQuickFilter('all');

  // 机构图表
  renderOrgChart(pendingAllRows);

  // 显示看板
  document.getElementById('dropZone').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('btnClear').style.display = 'inline-flex';
  document.getElementById('btnShare').style.display = 'inline-flex';

  var meta = document.getElementById('dataMeta');
  var hm = pad(now.getHours()) + ':' + pad(now.getMinutes());
  meta.textContent = '数据更新时间：' + fmtDate(now) + ' ' + hm + '\u3000共 ' + rows.length + ' 条记录';
}

// =========================================
// 快捷筛选（全部 / 本月 / 本周）
// =========================================
function switchQuickFilter(type) {
  currentQuickFilter = type;

  // 更新按钮高亮
  document.getElementById('qfAll').className = 'qf-btn' + (type === 'all' ? ' active' : '');
  document.getElementById('qfMonth').className = 'qf-btn' + (type === 'month' ? ' active' : '');
  document.getElementById('qfWeek').className = 'qf-btn' + (type === 'week' ? ' active' : '');

  // 重置搜索状态
  isSearchActive = false;
  document.getElementById('searchResultInfo').style.display = 'none';
  document.getElementById('searchOrg').value = '';
  document.getElementById('searchProj').value = '';
  document.getElementById('searchClient').value = '';
  document.getElementById('searchTime').value = '';
  document.getElementById('searchNature').value = '';

  var now = new Date();
  var weekRange = getWeekRange(now);
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  var monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
  var todayStart = new Date(now); todayStart.setHours(0,0,0,0);

  if (type === 'all') {
    // 全部：显示今日起的待开标项目
    quickFilterRows = pendingAllRows.slice();
  } else if (type === 'week') {
    // 本周：显示本周内的所有项目（含已开标）
    quickFilterRows = allRows.filter(function(r) {
      var t = r._time;
      return t && t >= weekRange.mon && t <= weekRange.sun;
    }).slice();
    quickFilterRows.sort(function(a, b) { return a._time - b._time; });
  } else if (type === 'month') {
    // 本月：显示本月内的所有项目（含已开标）
    quickFilterRows = allRows.filter(function(r) {
      var t = r._time;
      return t && t >= monthStart && t <= monthEnd;
    }).slice();
    quickFilterRows.sort(function(a, b) { return a._time - b._time; });
  }

  pendingFilteredRows = quickFilterRows.slice();
  pendingCurrentPage = renderTableWithPagination(pendingFilteredRows, 'pendingBody', 'pendingPagination', 1);
  updateSumAndCount(pendingFilteredRows);
}

function updateSumAndCount(data) {
  var total = 0;
  for (var i = 0; i < data.length; i++) { if (data[i]._amount !== null) total += data[i]._amount; }
  var sumEl = document.getElementById('pendingSum');
  if (data.length > 0) {
    sumEl.textContent = '合计：' + fmtAmount(total) + ' 万元';
    sumEl.style.display = 'block';
  } else {
    sumEl.style.display = 'none';
  }
  var countEl = document.getElementById('pendingCount');
  if (isSearchActive) {
    countEl.textContent = '筛选结果 ' + data.length + ' / ' + quickFilterRows.length + ' 个项目';
  } else {
    countEl.textContent = '共 ' + data.length + ' 个项目';
  }
}

// =========================================
// 文件处理
// =========================================
function handleDrop(e) {
  e.preventDefault();
  handleDragLeave();
  var file = e.dataTransfer.files[0];
  if (file) handleFile(file);
}
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.add('drag-over');
}
function handleDragLeave() {
  document.getElementById('dropZone').classList.remove('drag-over');
}

function handleFile(file) {
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  var reader = new FileReader();

  if (ext === 'csv') {
    reader.onload = function(e) {
      var rows = parseCSV(e.target.result);
      processRows(rows);
    };
    reader.readAsText(file, 'UTF-8');
  } else if (ext === 'xlsx' || ext === 'xls') {
    if (!XLSX_AVAILABLE && typeof XLSX === 'undefined') {
      showToast('Excel解析库未加载，请使用CSV格式，或联网后重试', 'error'); return;
    }
    reader.onload = function(e) {
      try {
        var wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'yyyy-mm-dd hh:mm:ss' });
        processRows(data);
      } catch(err) {
        showToast('Excel解析失败：' + err.message, 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    showToast('不支持的文件格式，请使用 xlsx、xls 或 csv', 'error');
  }
}

function parseCSV(text) {
  var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  return lines.map(function(line) {
    var result = [];
    var cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"' && inQ && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQ = !inQ;
      else if ((c === ',' || c === '\t') && !inQ) { result.push(cur); cur = ''; }
      else cur += c;
    }
    result.push(cur);
    return result;
  }).filter(function(r) { return r.some(function(c) { return c.trim(); }); });
}

function processRows(data) {
  if (!data || data.length < 2) {
    showToast('文件数据为空或格式不正确', 'error'); return;
  }

  var headers = data[0].map(function(h) { return String(h || '').trim(); });
  var colMap = detectColumns(headers);

  if (colMap.time === undefined) {
    showToast('未找到"开标时间"列，请确认表头包含相关字段', 'error'); return;
  }

  var rows = [];
  for (var i = 1; i < data.length; i++) {
    var row = data[i];
    if (!row || row.every(function(c) { return !c; })) continue;

    var timeVal = colMap.time !== undefined ? row[colMap.time] : null;
    var parsedTime = parseDate(timeVal);

    var nature = '';
    if (colMap.nature !== undefined && row[colMap.nature]) {
      var nv = String(row[colMap.nature]).trim();
      if (nv.indexOf('新拓') >= 0) nature = '新拓';
      else if (nv.indexOf('存量') >= 0) nature = '存量';
    }

    var r = {
      _time: parsedTime,
      _raw_time: timeVal,
      org: colMap.org !== undefined ? String(row[colMap.org] || '').trim() : '',
      proj: colMap.proj !== undefined ? String(row[colMap.proj] || '').trim() : '',
      client: colMap.client !== undefined ? String(row[colMap.client] || '').trim() : '',
      _amount: colMap.amount !== undefined ? parseAmount(row[colMap.amount]) : null,
      _nature: nature
    };
    // 机构名称统一映射
    if (r.org === '北京华瑞') r.org = '华瑞事业部';
    rows.push(r);
  }

  var validRows = rows.filter(function(r) { return r._time !== null; });
  if (validRows.length === 0) {
    showToast('共解析 ' + rows.length + ' 行，但无法识别开标时间，请检查日期格式', 'error'); return;
  }

  try {
    var saveData = {
      rows: validRows.map(function(r) {
        return {
          _time: r._time.toISOString(),
          _raw_time: r._raw_time,
          org: r.org,
          proj: r.proj,
          client: r.client,
          _amount: r._amount,
          _nature: r._nature
        };
      }),
      savedAt: new Date().toISOString()
    };
    localStorage.setItem('bidboard_data', JSON.stringify(saveData));
  } catch(e) { console.warn('localStorage保存失败', e); }

  renderDashboard(validRows);
  showToast('成功导入 ' + validRows.length + ' 条数据', 'success');
}

function shareDashboard() {
  try {
    var savedData = localStorage.getItem('bidboard_data');
    if (!savedData) { showToast('暂无数据可分享', 'error'); return; }

    // 独立的方式：生成精简的分享HTML
    var data = JSON.parse(savedData);
    var shareRows = data.rows;

    var html = buildSharePage(shareRows);
    downloadFile(html, '2026年开标项目进度看板（分享版）.html');
    showToast('分享成功', 'success');
  } catch(e) {
    console.error('分享失败:', e);
    showToast('分享失败，请直接复制此HTML文件发送', 'error');
  }
}

function buildSharePage(rows) {
  var now = new Date();
  var weekRange = getWeekRange(now);
  var weekNum = getWeekNumber(now);
  var todayStart = new Date(now); todayStart.setHours(0,0,0,0);
  var todayEnd = new Date(now); todayEnd.setHours(23,59,59,999);
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  var monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);

  // 分类数据
  var allData = [];
  var weekData = [];
  var monthData = [];
  var pendingData = [];
  for (var i = 0; i < rows.length; i++) {
    var t = new Date(rows[i]._time);
    allData.push(rows[i]);
    if (t >= weekRange.mon && t <= weekRange.sun) weekData.push(rows[i]);
    if (t >= monthStart && t <= monthEnd) monthData.push(rows[i]);
    if (t >= todayStart) pendingData.push(rows[i]);
  }
  weekData.sort(function(a,b) { return new Date(a._time) - new Date(b._time); });
  pendingData.sort(function(a,b) { return new Date(a._time) - new Date(b._time); });

  // 统计新拓/存量
  function cntNat(arr) {
    var xt=0, cl=0;
    for (var i=0;i<arr.length;i++) {
      if (arr[i]._nature==='新拓') xt++;
      else if (arr[i]._nature==='存量') cl++;
    }
    return {xt:xt, cl:cl, other:arr.length-xt-cl};
  }
  var wn = cntNat(weekData), pn = cntNat(pendingData);

  function fmtAmt(v) {
    if (v===null||v===undefined) return '-';
    return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function p2(n) { return n<10?'0'+n:n; }

  function detailHtml(c) {
    var h = '';
    if (c.xt>0) h += '<span class="detail-tag detail-xt">\u65b0\u62d3 '+c.xt+'</span>';

  // 机构分布分析（纯文字，不依赖 Chart.js）

  for (var i = 0; i < pendingData.length; i++) {

    var amtStr = (r._amount!==null ? fmtAmt(r._amount) : '-');

function esc2(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad2(n) { return n < 10 ? '0' + n : n; }

function downloadFile(content, filename) {
  var blob = new Blob([content], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

// =========================================
// 搜索
// =========================================
function doSearch() {
  var sOrg = document.getElementById('searchOrg').value.trim().toLowerCase();
  var sProj = document.getElementById('searchProj').value.trim().toLowerCase();
  var sClient = document.getElementById('searchClient').value.trim().toLowerCase();
  var sTime = document.getElementById('searchTime').value.trim();
  var sNature = document.getElementById('searchNature').value;

  var hasFilter = sOrg || sProj || sClient || sTime || sNature;
  var infoDiv = document.getElementById('searchResultInfo');

  if (!hasFilter) { resetSearch(); return; }

  pendingFilteredRows = quickFilterRows.filter(function(r) {
    if (sOrg && (r.org || '').toLowerCase().indexOf(sOrg) < 0) return false;
    if (sProj && (r.proj || '').toLowerCase().indexOf(sProj) < 0) return false;
    if (sClient && (r.client || '').toLowerCase().indexOf(sClient) < 0) return false;
    if (sTime) {
      var t = r._time;
      if (!t) return false;
      // 按月筛选：输入纯数字如 "04" 或 "4" 匹配月份
      var monthMatch = sTime.match(/^(\d{1,2})$/);
      if (monthMatch) {
        var targetMonth = parseInt(monthMatch[1], 10);
        if (t.getMonth() + 1 !== targetMonth) return false;
      } else {
        // 其他情况按字符串匹配（如 "04-15"、"2026-04"）
        var timeStr = fmtDate(r._time);
        if (timeStr.toLowerCase().indexOf(sTime.toLowerCase()) < 0) return false;
      }
    }
    if (sNature && r._nature !== sNature) return false;
    return true;
  });

  isSearchActive = true;
  pendingCurrentPage = renderTableWithPagination(pendingFilteredRows, 'pendingBody', 'pendingPagination', 1);
  updateSumAndCount(pendingFilteredRows);

  infoDiv.textContent = '搜索结果：找到 ' + pendingFilteredRows.length + ' 条记录（共 ' + quickFilterRows.length + ' 条）';
  infoDiv.style.display = 'block';
}

function resetSearch() {
  document.getElementById('searchOrg').value = '';
  document.getElementById('searchProj').value = '';
  document.getElementById('searchClient').value = '';
  document.getElementById('searchTime').value = '';
  document.getElementById('searchNature').value = '';
  document.getElementById('searchResultInfo').style.display = 'none';

  pendingFilteredRows = quickFilterRows.slice();
  isSearchActive = false;
  pendingCurrentPage = renderTableWithPagination(pendingFilteredRows, 'pendingBody', 'pendingPagination', 1);
  updateSumAndCount(pendingFilteredRows);
}

// =========================================
// 清除数据
// =========================================
function clearData() {
  if (!confirm('确定要清除所有已导入的数据吗？')) return;
  localStorage.removeItem('bidboard_data');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
  document.getElementById('btnClear').style.display = 'none';
  document.getElementById('btnShare').style.display = 'none';
  allRows = [];
  pendingAllRows = [];
  pendingFilteredRows = [];
  quickFilterRows = [];
  currentQuickFilter = 'all';
  isSearchActive = false;
  if (orgChartInstance) { orgChartInstance.destroy(); orgChartInstance = null; }
  document.getElementById('searchOrg').value = '';
  document.getElementById('searchProj').value = '';
  document.getElementById('searchClient').value = '';
  document.getElementById('searchTime').value = '';
  document.getElementById('searchNature').value = '';
  document.getElementById('searchResultInfo').style.display = 'none';
  showToast('数据已清除');
}

// =========================================
// Toast
// =========================================
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  setTimeout(function() { t.classList.add('show'); }, 10);
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// =========================================
// 启动
// =========================================
window.addEventListener('load', function() {
  XLSX_AVAILABLE = (typeof XLSX !== 'undefined');
  try {
    var cachedData = localStorage.getItem('bidboard_data');
    if (cachedData) {
      var data = JSON.parse(cachedData);
      if (data.rows && data.rows.length > 0) {
        var rows = data.rows.map(function(r) {
          return {
            _time: new Date(r._time),
            _raw_time: r._raw_time,
            org: r.org || '',
            proj: r.proj || '',
            client: r.client || '',
            _amount: r._amount,
            _nature: r._nature || ''
          };
        });
        renderDashboard(rows);
        document.getElementById('btnShare').style.display = 'inline-flex';
        var meta = document.getElementById('dataMeta');
        var savedAt = data.savedAt ? new Date(data.savedAt) : null;
        var savedAtStr = savedAt ? (fmtDate(savedAt) + ' ' + pad(savedAt.getHours()) + ':' + pad(savedAt.getMinutes())) : '未知';
        meta.textContent = '数据更新时间：' + savedAtStr + '\u3000共 ' + rows.length + ' 条记录';
      }
    }
  } catch(e) { console.warn('读取缓存失败', e); }
});
